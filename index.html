<!DOCTYPE html>
<html>
<head>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; worker-src 'self' blob:; child-src 'self' blob:; connect-src 'self' data: blob: http://127.0.0.1:4310 http://localhost:4310 ws://127.0.0.1:4310 ws://localhost:4310 http://172.23.10.51:4310 ws://172.23.10.51:4310; form-action 'self'; frame-ancestors 'self'">
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Automation Request System">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- The page's Content-Security-Policy is NOT written here. It is injected
       into build\web\index.html by tool\inject_csp.ps1, which deploy.ps1 runs
       after `flutter build web` — so the policy ships with production but is
       absent from `flutter run`.

       It has to be that way round: the debug build is compiled by DDC and
       loaded through eval(), and the hot-restart machinery adds inline
       scripts. Any policy strict enough to be worth having blocks both, and
       the app white-screens before it draws a single frame. Edit the policy in
       tool\inject_csp.ps1 — including the day TLS lands and the https:// /
       wss:// API origins have to go in. -->
  <title>Automation Request</title>
  <link rel="manifest" href="manifest.json">
  <!-- Automation mark, 256x256, trimmed of the source PNG's transparent margin
       so it fills the 16 px tab slot. The old TPK favicon.png is still here if
       we ever want it back. -->
  <link rel="icon" type="image/png" href="favicon_automation.png">
  <!-- Silences one benign engine error on every hot restart; see the file. -->
  <script src="engine_noise_filter.js"></script>
</head>
<body>
  <script src="auth_config.js"></script>
  <script src="msal_auth.js"></script>
  <script src="copy_image.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
